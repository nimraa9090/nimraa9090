name: Metrics
on:
  # Schedule updates (e.g., daily at midnight)
  schedule:
    - cron: "0 0 * * *"
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Repository Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: repository
          user: nimraa9090
          repo: GONIA.PK- # Replace with the specific repository you want to highlight
          filename: github-metrics-repository.svg
          
          # Enable plugins as needed:
          plugin_lines: yes
          plugin_followup: yes
